agilex_joy_controller:
  ros__parameters:
    # Scoutの速度上限。最初はinitial_speed_limit_factorで制限する。
    min_speed: 0.0
    max_speed: 1.6666
    wheel_base: 0.46
    max_steering_angle: 0.7
    min_angular_speed: -0.5
    max_angular_speed: 0.5
    initial_speed_limit_factor: 0.5
    speed_limit_step: 0.1

    # Joy入力設定（既定値は一般的なXboxコントローラ向け）。
    deadman_button: 3
    speed_up_button: 5
    speed_down_button: 4
    speed_axis: 1
    steering_axis: 3
    input_gain: 1.0
    deadzone: 0.05

    joy_topic: /joy
    control_command_topic: /control/command/control_cmd
    cmd_vel_topic: /cmd_vel
    control_mode_topic: /vehicle/status/control_mode
    joy_timeout: 0.5
    control_timeout: 0.5
